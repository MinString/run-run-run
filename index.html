<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Run Run Run</title>
<style>
  :root { --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
  body { position: relative; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
  #game canvas { display: block; width: 100% !important; height: 100% !important; }

  #touch-controls { position: fixed; inset: 0; z-index: 20; pointer-events: none; font-family: system-ui, sans-serif; }
  .cluster { position: absolute; bottom: calc(20px + var(--safe-bottom)); display: flex; gap: 12px; pointer-events: none; }
  #movement { left: calc(18px + var(--safe-left)); }
  #actions { right: calc(18px + var(--safe-right)); }

  .touch-btn {
    width: clamp(64px, 17vw, 96px);
    height: clamp(64px, 17vw, 96px);
    border: 2px solid rgba(255,255,255,.65);
    border-radius: 50%;
    box-sizing: border-box;
    background: rgba(15,20,28,.52);
    color: #fff;
    font-size: clamp(27px, 7vw, 42px);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(0,0,0,.28);
  }
  .touch-btn:active { background: rgba(255,255,255,.28); transform: scale(.94); }

  /* Phones in portrait: keep controls large but compact. */
  @media (orientation: portrait) and (max-width: 700px) {
    .cluster { bottom: calc(16px + var(--safe-bottom)); gap: 8px; }
    #movement { left: calc(12px + var(--safe-left)); }
    #actions { right: calc(12px + var(--safe-right)); }
    .touch-btn { width: clamp(60px, 18vw, 82px); height: clamp(60px, 18vw, 82px); }
  }

  /* Desktop/laptop: don't show mobile controls. */
  @media (hover: hover) and (pointer: fine) { #touch-controls { display: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
<div id="game"></div>
<div id="touch-controls" aria-label="触摸操作">
  <div id="movement" class="cluster">
    <div id="left" class="touch-btn" aria-label="向左">◀</div>
    <div id="right" class="touch-btn" aria-label="向右">▶</div>
  </div>
  <div id="actions" class="cluster">
    <div id="jump" class="touch-btn" aria-label="跳跃">▲</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
